<title>CareReach Health Assistant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B6E55">
<meta name="description" content="Offline-first health assistant for community health workers: symptom triage, health education, patient records and referrals.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column field tool. Sticky header, scrolling view, thumb-reach tab bar at the bottom on phones; tabs move into the header on wide screens. Triage uses IMCI pink / yellow / green. */
:root {
  --bg: #EEF2EF;
  --surface: #FFFFFF;
  --sunk: #E3E9E5;
  --ink: #13221C;
  --muted: #56675F;
  --line: #CFD9D3;
  --accent: #0B6E55;
  --accent-ink: #FFFFFF;
  --accent-soft: #D6EDE4;
  --pink: #B0144F;  --pink-bg: #FBE1EB;
  --yellow: #7A5B00; --yellow-bg: #FFF1BF;
  --green: #1B6E36;  --green-bg: #DDF2E2;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1613; --surface: #15211C; --sunk: #1B2A24; --ink: #E2ECE6; --muted: #93A79D; --line: #2A3B34;
  --accent: #4FC49C; --accent-ink: #052419; --accent-soft: #163A2D;
  --pink: #F58FB4; --pink-bg: #3B1627; --yellow: #F0CD5A; --yellow-bg: #362D0E; --green: #7DD995; --green-bg: #14301C;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E1613; --surface: #15211C; --sunk: #1B2A24; --ink: #E2ECE6; --muted: #93A79D; --line: #2A3B34;
  --accent: #4FC49C; --accent-ink: #052419; --accent-soft: #163A2D;
  --pink: #F58FB4; --pink-bg: #3B1627; --yellow: #F0CD5A; --yellow-bg: #362D0E; --green: #7DD995; --green-bg: #14301C;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.label { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

#app { height: 100%; display: flex; flex-direction: column; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.top-row { display: flex; align-items: center; gap: 12px; max-width: 980px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-size: 1.15rem; white-space: nowrap; }
.brand .sub { font-size: 0.75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 0.78rem; font-weight: 700; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.on { color: var(--green); }
.pill.off { color: var(--yellow); background: var(--yellow-bg); border-color: transparent; }
button.pill { cursor: pointer; }

main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.view { max-width: 980px; margin: 0 auto; padding-block: 18px 28px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); display: grid; gap: 16px; }
.view > * { min-width: 0; }

nav.tabs { display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs button { flex: 1; border: 0; background: none; padding: 8px 2px 9px; display: grid; justify-items: center; gap: 2px; font-size: 0.72rem; font-weight: 700; color: var(--muted); cursor: pointer; position: relative; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs button[aria-current="page"]::after { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
nav.tabs .badge { position: absolute; top: 4px; left: calc(50% + 6px); background: var(--pink); color: var(--surface); border-radius: 999px; font-size: 0.65rem; padding: 0 5px; line-height: 1.5; }
@media (min-width: 820px) {
  #app { flex-direction: column; }
  nav.tabs { order: -1; position: sticky; top: 0; border-top: 0; border-bottom: 1px solid var(--line); justify-content: center; padding-inline: var(--gutter-l) var(--gutter-r); }
  nav.tabs button { flex: 0 1 140px; grid-auto-flow: column; gap: 8px; font-size: 0.9rem; padding: 10px; }
  nav.tabs button svg { width: 20px; height: 20px; }
  nav.tabs button[aria-current="page"]::after { top: auto; bottom: 0; border-radius: 3px 3px 0 0; }
  nav.tabs .badge { top: 4px; left: auto; right: 8px; }
  header.top { position: static; }
}

/* Buttons and forms */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; justify-content: center; min-height: 44px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--pink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { min-height: 36px; padding: 6px 10px; font-size: 0.875rem; }
.btn:disabled { opacity: 0.5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 0.85rem; font-weight: 700; }
input[type="text"], input[type="number"], input[type="date"], input[type="url"], input[type="search"], select, textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; min-height: 44px; }
textarea { min-height: 80px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Triage classification */
.tri { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 2px 9px; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.02em; white-space: nowrap; }
.tri.urgent { background: var(--pink-bg); color: var(--pink); }
.tri.clinic { background: var(--yellow-bg); color: var(--yellow); }
.tri.home { background: var(--green-bg); color: var(--green); }
.result { border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.result-band { padding: 14px 16px; display: grid; gap: 4px; }
.result-band.urgent { background: var(--pink-bg); color: var(--pink); }
.result-band.clinic { background: var(--yellow-bg); color: var(--yellow); }
.result-band.home { background: var(--green-bg); color: var(--green); }
.result-band h3 { font-size: 1.3rem; }
.result-body { padding: 14px 16px; display: grid; gap: 14px; }
.result ul, .card ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.reason { display: flex; gap: 8px; align-items: baseline; }
.reason i { width: 9px; height: 9px; border-radius: 2px; flex: none; transform: translateY(1px); }
.reason i.urgent { background: var(--pink); } .reason i.clinic { background: var(--yellow); } .reason i.home { background: var(--green); }
.likely { display: grid; gap: 6px; }
.likely button { text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface); cursor: pointer; }
.likely .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; }
.likely .bar span { display: block; height: 100%; background: var(--accent); }

/* Assistant chat */
.chat { display: grid; gap: 12px; }
.msg { max-width: min(640px, 92%); display: grid; gap: 8px; }
.msg.bot { justify-self: start; }
.msg.user { justify-self: end; }
.bubble { padding: 10px 14px; border-radius: 16px; }
.msg.bot .bubble { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 4px; }
.msg.user .bubble { background: var(--accent); color: var(--accent-ink); border-top-right-radius: 4px; }
.msg .who { font-size: 0.72rem; color: var(--muted); font-weight: 700; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; cursor: pointer; font-size: 0.9rem; min-height: 38px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 700; }
.chip.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.checklist { display: grid; gap: 6px; }
.checklist label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; }
.checklist input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--pink); flex: none; }
.checklist label:has(input:checked) { border-color: var(--pink); background: var(--pink-bg); }
.composer { position: sticky; bottom: 0; background: linear-gradient(to bottom, transparent, var(--bg) 28%); padding-top: 18px; }
.composer form { display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px; }
.composer input { border: 0; min-height: 44px; flex: 1; min-width: 0; background: transparent; padding: 0 8px; }
.composer input:focus { outline: none; }
.composer form:focus-within { border-color: var(--accent); }
.patient-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; }

/* Lists */
.list { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; cursor: pointer; text-align: left; width: 100%; }
.item:hover { border-color: var(--accent); }
.item > div { min-width: 0; }
.item .title { font-weight: 700; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-family: var(--font-display); }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 1px 7px; border-radius: 5px; background: var(--sunk); color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
.kv dt { color: var(--muted); font-size: 0.875rem; }
.kv dd { margin: 0; }
.vitals { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.vital { background: var(--sunk); border-radius: 8px; padding: 6px 10px; }
.vital b { display: block; font-family: var(--font-data); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.timeline { display: grid; gap: 10px; }
.tl { border-left: 3px solid var(--line); padding-left: 12px; display: grid; gap: 6px; }
.tl.urgent { border-color: var(--pink); } .tl.clinic { border-color: var(--yellow); } .tl.home { border-color: var(--green); }

/* Library */
.cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.cats .chip { flex: none; }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.lib button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; cursor: pointer; display: grid; gap: 6px; align-content: start; }
.lib button:hover { border-color: var(--accent); }
.lib .t { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.lib p { font-size: 0.875rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.article { display: grid; gap: 16px; max-width: 68ch; }
.article h3 { margin-top: 4px; }
.article .src { font-size: 0.85rem; }
.article a { color: var(--accent); }

/* Referral slip */
.slip { background: var(--surface); border: 1px dashed var(--muted); border-radius: 8px; padding: 16px; font-size: 0.95rem; display: grid; gap: 8px; }
.slip pre { margin: 0; white-space: pre-wrap; font-family: var(--font-data); font-size: 0.85rem; overflow-x: auto; }
.code { font-family: var(--font-data); font-weight: 500; letter-spacing: 0.08em; white-space: nowrap; }

.banner { border-radius: var(--r); padding: 12px 14px; background: var(--accent-soft); display: grid; gap: 4px; font-size: 0.9rem; }
.banner.warn { background: var(--yellow-bg); color: var(--ink); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.stat b { font-family: var(--font-display); font-size: 1.6rem; display: block; line-height: 1.1; font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700; z-index: 20; max-width: calc(100% - 32px); width: max-content; text-align: center; }
dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; width: min(560px, calc(100% - 24px)); background: var(--surface); color: var(--ink); max-height: 88vh; }
dialog::backdrop { background: rgb(0 0 0 / 0.45); }
dialog form, dialog .dlg { padding: 18px; display: grid; gap: 12px; }
@media (prefers-reduced-motion: no-preference) {
  .msg { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
}
</style>

<div id="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="var(--accent)"/><path d="M14 8h6v6h6v6h-6v6h-6v-6H8v-6h6z" fill="var(--accent-ink)"/><circle cx="26" cy="8" r="4" fill="var(--yellow-bg)" stroke="var(--accent)" stroke-width="2"/></svg>
        <div style="min-width:0">
          <h1>CareReach</h1>
          <div class="sub" id="chwName">Community health assistant</div>
        </div>
      </div>
      <div class="status">
        <span class="pill" id="netPill"><span class="dot"></span><span>Online</span></span>
        <button class="pill" id="syncPill" type="button" title="Records waiting to sync"></button>
      </div>
    </div>
  </header>
  <main id="main"></main>
  <nav class="tabs" aria-label="Sections">
    <button type="button" data-tab="assist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M12 8v6M9 11h6"/></svg>Assistant</button>
    <button type="button" data-tab="patients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg>Patients</button>
    <button type="button" data-tab="referrals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h13M13 6l6 6-6 6"/><path d="M4 5v14"/></svg>Referrals<span class="badge" id="refBadge" hidden></span></button>
    <button type="button" data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H11v17H5.5A2.5 2.5 0 0 0 3 22.5z"/><path d="M21 5.5A2.5 2.5 0 0 0 18.5 3H13v17h5.5a2.5 2.5 0 0 1 2.5 2.5z"/></svg>Learn</button>
    <button type="button" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Sync &amp; setup</button>
  </nav>
</div>
<dialog id="dlg"></dialog>

<script src="kb.js"></script>
<script src="engine.js"></script>
